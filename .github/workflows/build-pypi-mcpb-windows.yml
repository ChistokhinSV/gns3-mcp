name: Build Windows MCP Extension

on:
  workflow_dispatch:  # Manual trigger
  push:
    tags:
      - 'v*'  # Trigger on version tags

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # prepare_mcpb.py needs tomllib (3.11+); the wheel is pure Python

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build tools for PyPI
        run: |
          pip install build twine

      # Manifest 0.4 "uv" server type: Claude Desktop installs the dependencies from
      # the bundle's pyproject.toml, so the bundle carries source code only (no uv.exe)
      - name: Prepare bundle (source + generated pyproject.toml)
        run: |
          python scripts/prepare_mcpb.py

      - name: Validate manifest and build .mcpb
        run: |
          cd mcp-server
          npx @anthropic-ai/mcpb@2.1.2 validate manifest.json
          npx @anthropic-ai/mcpb@2.1.2 pack

      - name: Verify build output
        run: |
          if (!(Test-Path mcp-server\mcp-server.mcpb)) {
            Write-Host "Error: mcp-server.mcpb was not created"
            exit 1
          }
          Get-Item mcp-server\mcp-server.mcpb | Format-List

          # The host runs gns3_mcp_server.py with deps from pyproject.toml - all must be inside
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path mcp-server\mcp-server.mcpb))
          try {
            $names = $zip.Entries | ForEach-Object { $_.FullName.Replace('\', '/') }
          } finally {
            $zip.Dispose()
          }
          foreach ($required in 'manifest.json', 'pyproject.toml', 'gns3_mcp_server.py', 'gns3_mcp/cli.py', 'gns3_mcp/server/main.py') {
            if ($names -notcontains $required) {
              Write-Host "ERROR: $required missing from .mcpb"
              exit 1
            }
          }
          Write-Host "Bundle contents OK ($($names.Count) files)"

      - name: Smoke test bundle (run it the way Claude Desktop does)
        run: |
          pip install uv mcp
          python scripts/smoke_test_mcpb.py mcp-server/mcp-server.mcpb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcp-server-windows
          path: mcp-server\mcp-server.mcpb
          retention-days: 30

      - name: Extract version and check for tag
        id: version
        run: |
          $manifest = Get-Content mcp-server\manifest.json | ConvertFrom-Json
          $version = $manifest.version
          echo "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

          # Check if current commit has a version tag
          $tag = git describe --exact-match --tags HEAD 2>$null
          if ($tag -match "^v") {
            echo "is_tagged=true" >> $env:GITHUB_OUTPUT
            Write-Host "This commit is tagged for release"
          } else {
            echo "is_tagged=false" >> $env:GITHUB_OUTPUT
            Write-Host "This commit is not tagged"
          }

      - name: Build PyPI distributions
        if: steps.version.outputs.is_tagged == 'true'
        run: |
          python -m build
          Get-ChildItem dist\
          # The server reads instructions.md at runtime; it was missing from every wheel before 0.56.3
          python -c "import glob, sys, zipfile; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); ok = 'gns3_mcp/server/instructions.md' in names; print('instructions.md in wheel:', ok); sys.exit(0 if ok else 1)"

      - name: Publish to PyPI
        if: steps.version.outputs.is_tagged == 'true'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          python -m twine upload dist\*

      - name: Create Release
        if: steps.version.outputs.is_tagged == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            mcp-server/mcp-server.mcpb
            dist/*.whl
            dist/*.tar.gz
          tag_name: v${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body: |
            ## GNS3 MCP Server v${{ steps.version.outputs.version }}

            ### 🚀 Quick Installation (Claude Code)

            **Option 1: Using uvx (Recommended - Faster)**
            ```powershell
            claude mcp add --transport stdio gns3-mcp --env GNS3_HOST=localhost --env GNS3_PORT=80 --env GNS3_USER=admin --env GNS3_PASSWORD=your-password --scope user -- uvx gns3-mcp@latest
            ```

            Omit default parameters and it would be:
            ```powershell
            claude mcp add --transport stdio gns3-mcp --env GNS3_HOST=192.168.1.20 --env GNS3_PASSWORD=your-password --scope user -- uvx gns3-mcp@latest
            ```

            **Option 2: Using pip (Traditional)**
            Step 1: Install package
            ```powershell
            pip install gns3-mcp
            ```

            Step 2: Add to Claude Code with credentials
            ```powershell
            claude mcp add --transport stdio gns3-mcp --env GNS3_HOST=localhost --env GNS3_PORT=80 --env GNS3_USER=admin --env GNS3_PASSWORD=your-password --scope user -- gns3-mcp
            ```

            **Claude Desktop:**
            Download `mcp-server.mcpb` → double-click to install → configure credentials in settings.

            **Cursor/Windsurf:**
            See [full installation guide](https://github.com/${{ github.repository }}/blob/master/README.md#installation) for JSON configuration examples.

            ### 🐳 Docker Deployment

            `MCP_API_KEY` is required (v0.55.0+); clients send it in the `MCP_API_KEY` header.

            **Quick Start with Docker Compose:**
            - Download docker-compose.yml and .env.example:
            ```bash
            curl -O https://raw.githubusercontent.com/${{ github.repository }}/master/docker-compose.yml
            curl -O https://raw.githubusercontent.com/${{ github.repository }}/master/.env.example
            ```

            - Configure credentials
            ```bash
            mv .env.example .env
            ```
            - Edit .env with your GNS3 server details

            - Start stack (MCP server + SSH proxy)
            ```bash
            docker-compose up -d
            ```

            **Docker Run (MCP server only, SSH proxy in separate container):**
            ```bash
            docker run -d \
              --name gns3-mcp \
              -p 8000:8000 \
              -e GNS3_HOST=192.168.1.20 \
              -e GNS3_PORT=80 \
              -e GNS3_USER=admin \
              -e GNS3_PASSWORD=your-password \
              -e MCP_API_KEY=your-random-token-here \
              chistokhinsv/gns3-mcp:${{ steps.version.outputs.version }}
            ```

            **Docker Hub:**
            - Image: `chistokhinsv/gns3-mcp:${{ steps.version.outputs.version }}`
            - Tags: `${{ steps.version.outputs.version }}`, `latest`
            - Platforms: linux/amd64, linux/arm64
            - [View on Docker Hub](https://hub.docker.com/r/chistokhinsv/gns3-mcp)

            ### Changes
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for details.

            ### Platform
            - **Desktop Extension (.mcpb):** Claude Desktop on Windows and macOS. Uses the MCPB uv runtime: Claude Desktop installs the dependencies on first start.
            - **Claude Code / Cowork plugin:** `/plugin marketplace add ${{ github.repository }}`, then `/plugin install gns3-lab@gns3-mcp`. Needs uv on the machine.
            - **uv/pip and Docker:** Windows, Linux and macOS.
            - **Python:** 3.10-3.13
            - Built on: windows-latest runner
          draft: false
          prerelease: false
