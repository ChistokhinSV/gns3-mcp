name: GitHub Pages

# Publishes site/ (install page + install.md for agents) to
# https://chistokhinsv.github.io/gns3-mcp (GM-102)
on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "plugin/assets/icon.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # The icon lives with the plugin; one copy in git is enough
      - name: Add icon
        run: cp plugin/assets/icon.png site/icon.png

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
